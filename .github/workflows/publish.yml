name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Verify release version
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const { name, version } = JSON.parse(fs.readFileSync("package.json", "utf8"));
          if (name !== "react-sourcetrace" || process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error("The release tag must match the package name and version.");
          }
          const tag = version.includes("-") || process.env.RELEASE_PRERELEASE === "true"
            ? "next" : "latest";
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `npm-tag=${tag}\n`);
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Publish with OIDC
        env:
          NPM_TAG: ${{ steps.release.outputs.npm-tag }}
        run: npm run publish:npm -- --tag "$NPM_TAG"
